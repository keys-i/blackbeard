version: 2

project_name: blackbeard
report_sizes: true
dist: src/build/release

builds:
  - id: blackbeard
    dir: src
    main: ./cmd/blackbeard
    binary: blackbeard
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -X github.com/keys-i/blackbeard/src/internal/version.Version={{ .Version }}

archives:
  - ids:
      - blackbeard
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "blackbeard_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - src: docs/THIRD_PARTY_NOTICES.md
        dst: THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    cmd: "{{ .Env.SYFT_CMD }}"
    documents:
      - "${artifact}.spdx.json"
    args:
      - "$artifact"
      - --output
      - "spdx-json=$document"

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

release:
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  mode: keep-existing
  name_template: "{{ .Env.RELEASE_NAME }}"

changelog:
  disable: true
